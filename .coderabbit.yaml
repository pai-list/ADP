# CodeRabbit Configuration for PAI ecosystem repos
# Docs: https://docs.coderabbit.ai/reference/configuration

reviews:
  profile: "assertive"
  review_status: true
  review_status_check:
    enabled: true
    context: "CodeRabbit Review"
    target: "approval"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
    ignore_title_keywords: []
    review_bots: true
  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/__snapshots__/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.svg"
    - "!**/*.ico"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.ttf"
    - "!**/coverage/**"
    - "!**/.vercel/**"
    - "!**/.venv/**"
    - "!**/vendor/**"

  request_changes_workflow: false
  high_level_summary: true
  summarize:
    early_summarizer: false
    enable_comment_creation: true
    free_instructions: >
      Follow the SOUL Protocol: Muraqabah (divine accountability), Sidq (absolute
      truthfulness — never fabricate metrics), Tawbah (admit and fix errors),
      Rahma (serve users, never exploit). Flag security issues, correctness bugs,
      and missing tests. Be concise and direct.

chat:
  auto_reply: true

language: "en-US"
